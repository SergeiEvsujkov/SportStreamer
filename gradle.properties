# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
#
# Для получения дополнительной информации о настройке сборки посетите
# http://www.gradle.org/docs/current/userguide/build_environment.html
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Параллельная и кэширующая сборка: повторные сборки заметно быстрее.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies
android.nonTransitiveRClass=true

# --- Флаги совместимости AGP 9 -------------------------------------------------
# Включены осознанно, чтобы сборка вела себя как раньше. Если решите перейти на
# новый DSL AGP целиком, эти строки нужно снимать по одной и проверять сборку.
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# --- Если снова появятся ошибки Kotlin-демона на Windows ----------------------
# Симптом: %PROJECT%\.kotlin\errors\*.log → "Daemon compilation failed: null" и
# java.nio.file.DirectoryNotEmptyException: %TEMP%\kotlin-backups...
# Лечение: закрыть Android Studio, удалить %TEMP%\kotlin-backups*, затем
#   gradlew --stop
# Если повторяется — раскомментируйте строку ниже (компиляция без демона, медленнее):
# kotlin.compiler.execution.strategy=in-process
